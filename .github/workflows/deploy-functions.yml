# Déploiement des fonctions edge Supabase à chaque fusion sur main
# qui touche supabase/functions (plus de copier-coller dans le
# tableau de bord).
#
# Seules les fonctions sont déployées : les migrations SQL restent
# lancées à la main dans l'éditeur Supabase.
# Le réglage « Verify JWT » de chaque fonction vient de
# supabase/config.toml (désactivé pour lovense-callback et
# send-scheduled, appelées sans session).
#
# Secrets à créer (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN   jeton personnel Supabase (Account → Access Tokens)
#   SUPABASE_PROJECT_REF    identifiant du projet (Project Settings → General)

name: Fonctions edge

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  # et à la demande : Actions → Fonctions edge → Run workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Vérifier les secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Secrets SUPABASE_ACCESS_TOKEN et SUPABASE_PROJECT_REF manquants."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # version fixée : la 3.x a changé les options de déploiement
          version: 2.122.0

      - name: Déployer toutes les fonctions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
